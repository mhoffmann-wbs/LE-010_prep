name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Not ubuntu-latest: its kernel (7.0) gives 32-bit programs no sockets, so the
    # i386 guest build fails (apt can't resolve hosts, groupadd can't reach audit).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The learner's Linux, public/vm/, is cached by what goes into it. On a hit,
      # npm test (verify.test.ts) has already checked every claim against
      # verified.json, so the guest isn't rebuilt and nothing is rerun.
      - id: vm-cache
        uses: actions/cache/restore@v4
        with:
          path: public/vm
          key: vm-${{ hashFiles('scripts/vm/Dockerfile', 'scripts/vm/le-init', 'scripts/vm/build-image.sh', 'scripts/vm/build-state.ts', 'scripts/vm/v86/**', 'src/vm/config.ts', 'package-lock.json') }}
      # On a miss, build the i386 guest and boot it once to save its state.
      - if: steps.vm-cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y python3-zstandard zstd
      - if: steps.vm-cache.outputs.cache-hit != 'true'
        run: npm run vm:build
      - if: steps.vm-cache.outputs.cache-hit != 'true'
        run: npm run vm:state
      - run: npm run vm:smoke
      # Rerun every claimed output in the fresh guest: package updates can change them.
      # Only a guest that passes is cached.
      - if: steps.vm-cache.outputs.cache-hit != 'true'
        run: npm run content:verify -- --all
      - if: steps.vm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: public/vm
          key: ${{ steps.vm-cache.outputs.cache-primary-key }}
      - run: npm run build
        env:
          BASE_PATH: /LE-010_prep/
      # SPA deep links: Pages serves 404.html for unknown paths.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
