name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The learner's Linux: build the i386 guest and boot it once to save its state.
      - run: sudo apt-get install -y python3-zstandard zstd
      - run: npm run vm:build
      - run: npm run vm:state
      - run: npm run vm:smoke
      # Rerun every claimed output in the fresh guest: package updates can change them.
      - run: npm run content:verify -- --all
      - run: npm run build
        env:
          BASE_PATH: /LE-010_prep/
      # SPA deep links: Pages serves 404.html for unknown paths.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
